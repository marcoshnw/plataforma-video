<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Plataforma - Vídeos</title>

<link rel="icon" href="img/favicon.png?v=3" type="image/png">

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">
    <div class="login-background"></div>
    
    <div class="login-container">
        <div class="login-card">
            <!-- Logo -->
            <div class="login-logo">
                <span class="logo-red">#noc</span>
                <span class="logo-white">class!</span>
            </div>

            <!-- Header -->
            <div class="login-header">
                <h1>Entre em sua conta</h1>
                <p>Conheça o ambiente ideal para organizar seus estudos</p>
            </div>
            
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="username">Usuário</label>
                    <input type="text" id="username" name="username" placeholder="Digite seu usuário" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" placeholder="Digite sua senha" required>
                </div>
                
                <button type="submit" class="login-btn">Entrar</button>
                
                <p class="error-message" id="errorMessage"></p>
            </form>
        </div>
    </div>

   <!-- Overlay de transição -->
<div class="transition-overlay" id="transitionOverlay">
    <div class="transition-m" id="transitionM">
        <img src="img/favicon.png" alt="Logo">
    </div>
</div>

<script src="js/login.js"></script>
</body>
</html>
